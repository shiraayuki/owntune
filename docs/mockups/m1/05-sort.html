<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>05 Sort songs</title><link rel="stylesheet" href="mockup.css"><script src="mockup.js"></script></head>
<body>
<div class="screen">
  <div class="status"><span>9:41</span><span class="dots"><i></i></span></div>
  <div class="appbar">
    <h1>Songs</h1>
    <div class="actions"><span class="icon-btn"><svg class="ico"><use href="#i-search"/></svg></span><span class="icon-btn accent"><svg class="ico"><use href="#i-plus"/></svg></span></div>
  </div>
  <div class="meta-row"><span>47 songs</span><span class="chip"><svg class="ico"><use href="#i-sort"/></svg>Title</span></div>
  <div class="scroll">
    <div class="song"><div class="art c2"></div><div class="txt"><div class="t">After the Rain</div><div class="s">Juno Vale · Paper Lanterns</div></div><div class="d">3:42</div></div>
    <div class="song"><div class="art c6"></div><div class="txt"><div class="t">Amber Lights</div><div class="s">Neon Harbor · Velvet Hours</div></div><div class="d">4:05</div></div>
    <div class="song"><div class="art c5"></div><div class="txt"><div class="t">Backroads</div><div class="s">Kettle &amp; Pine · Northbound</div></div><div class="d">3:18</div></div>
  </div>
  <div class="scrim"></div>
  <div class="sheet">
    <div class="grab"></div>
    <h2>Sort songs by</h2>
    <div style="margin-top:12px">
      <div class="option-row">Title <svg class="ico"><use href="#i-check"/></svg></div>
      <div class="option-row">Artist</div>
      <div class="option-row">Album</div>
      <div class="option-row">Recently added</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <span class="chip active">A → Z</span><span class="chip">Z → A</span>
    </div>
  </div>
</div>
</body>
</html>
