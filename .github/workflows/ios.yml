name: iOS

# Unsigned owntune.ipa for SideStore.
# Called by the Release workflow on version tags; by hand (gh workflow run iOS)
# it builds an artifact only, no release. Runs only then: macOS runners often
# have long queue times.
on:
  workflow_call:
    inputs:
      runner:
        description: "macOS runner"
        type: string
        default: macos-15-intel
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (arm64 runners are often at capacity)"
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-latest]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get

      - name: Build iOS app (unsigned)
        run: |
          ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=$(tool/release_version.sh "$GITHUB_REF_NAME")
            read -r name number <<< "$version"
            ARGS=(--build-name="$name" --build-number="$number")
          fi
          flutter build ios --release --no-codesign "${ARGS[@]}"

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr owntune.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: owntune-ipa
          path: owntune.ipa
          if-no-files-found: error
