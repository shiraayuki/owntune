<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>11 Settings</title><link rel="stylesheet" href="mockup.css"><script src="mockup.js"></script></head>
<body>
<div class="recessed">
  <div class="screen">
    <div class="status"><span>9:41</span><span class="bat"></span></div>
    <div class="navrow"><span class="glass"><svg class="ico"><use href="#i-ellipsis"/></svg></span><span class="glass tint"><svg class="ico"><use href="#i-plus"/></svg></span></div>
    <div class="large-title">Songs</div>
  </div>
</div>
<div class="sheet" style="top:56px;background:var(--bg);padding-bottom:0">
  <div class="grab"></div>
  <div class="sheet-head"><span></span><h2>Settings</h2><span class="action">Done</span></div>

  <div class="group-label">Appearance</div>
  <div class="group">
    <div class="cell" style="padding:8px 12px"><div class="segmented"><span>System</span><span data-seg="light">Light</span><span data-seg="dark">Dark</span></div></div>
  </div>

  <div class="group-label">Accent Color · Dark Mode</div>
  <div class="group">
    <div class="swatches">
      <span class="swatch" data-accent="ff7a59" style="background:#ff7a59" title="Coral"></span>
      <span class="swatch" data-accent="ffb340" style="background:#ffb340" title="Amber"></span>
      <span class="swatch" data-accent="c6f432" style="background:#c6f432" title="Lime"></span>
      <span class="swatch" data-accent="3ee0c4" style="background:#3ee0c4" title="Teal"></span>
      <span class="swatch" data-accent="5ab4ff" style="background:#5ab4ff" title="Sky"></span>
      <span class="swatch" data-accent="b38cff" style="background:#b38cff" title="Violet"></span>
      <span class="swatch" data-accent="ff6fb5" style="background:#ff6fb5" title="Pink"></span>
    </div>
  </div>
  <div class="group-foot">Light mode stays monochrome.</div>

  <div class="group-label">Library</div>
  <div class="group">
    <div class="cell"><span class="badge" style="background:#8e8e93"><svg class="ico"><use href="#i-disk"/></svg></span>Storage Used<span class="v">412 MB</span></div>
    <div class="cell"><span class="badge" style="background:#8e8e93"><svg class="ico"><use href="#i-music-note"/></svg></span>Songs<span class="v">47</span></div>
  </div>

  <div class="group-label">About</div>
  <div class="group">
    <div class="cell"><span class="badge" style="background:#8e8e93"><svg class="ico"><use href="#i-info"/></svg></span>Version<span class="v">0.2.0</span></div>
  </div>
</div>
<div class="home-ind"></div>
</body>
</html>
