name: iOS

# Nur für Releases: macOS-Runner haben oft lange Wartezeiten.
# Versions-Tag (git tag v0.1.0 && git push --tags) → .ipa + GitHub-Release mit
# SideStore-Quelle (releases/latest/download/source.json).
# Manuell (gh workflow run iOS) → nur .ipa als Artifact, kein Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS-Runner (arm64-Runner sind oft ausgelastet)"
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-latest]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get

      - name: iOS-App bauen (unsigniert)
        run: |
          ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS=(--build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER")
          fi
          flutter build ios --release --no-codesign "${ARGS[@]}"

      - name: .ipa packen
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr owntune.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: owntune-ipa
          path: owntune.ipa
          if-no-files-found: error

      - name: GitHub-Release mit SideStore-Quelle
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart run tool/sidestore_source.dart "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" owntune.ipa > source.json
          gh release create "$GITHUB_REF_NAME" owntune.ipa source.json \
            --title "owntune $GITHUB_REF_NAME" --generate-notes
