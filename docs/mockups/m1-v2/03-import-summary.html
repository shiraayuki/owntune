<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>03 Import summary</title><link rel="stylesheet" href="mockup.css"><script src="mockup.js"></script></head>
<body>
<div class="recessed">
  <div class="screen">
    <div class="status"><span>9:41</span><span class="bat"></span></div>
    <div class="navrow"><span class="glass"><svg class="ico"><use href="#i-ellipsis"/></svg></span><span class="glass tint"><svg class="ico"><use href="#i-plus"/></svg></span></div>
    <div class="large-title">Songs</div>
    <div class="search"><svg class="ico"><use href="#i-search"/></svg>Search Songs</div>
    <div class="scroll">
      <div class="row"><div class="art c2"></div><div class="txt"><div class="t">After the Rain</div><div class="s">Juno Vale</div></div></div>
      <div class="row"><div class="art c6"></div><div class="txt"><div class="t">Amber Lights</div><div class="s">Neon Harbor</div></div></div>
    </div>
  </div>
</div>
<div class="sheet" style="background:var(--bg)">
  <div class="grab"></div>
  <div class="sheet-head"><span></span><h2>Import Complete</h2><span class="action">Done</span></div>
  <div class="group">
    <div class="cell tall"><span class="badge green"><svg class="ico"><use href="#i-check"/></svg></span><div class="two"><div>47 Songs Added</div><div class="s">8 albums · 7 artists</div></div></div>
    <div class="cell tall"><span class="badge blue"><svg class="ico"><use href="#i-doc-copy"/></svg></span><div class="two"><div>2 Duplicates Skipped</div><div class="s">Already in your library</div></div><svg class="ico chev" style="margin-left:auto;color:var(--faint)"><use href="#i-chevron-right"/></svg></div>
    <div class="cell tall"><span class="badge orange"><svg class="ico"><use href="#i-warn"/></svg></span><div class="two"><div>1 File Not Supported</div><div class="s">evening-walk.ogg</div></div><svg class="ico chev" style="margin-left:auto;color:var(--faint)"><use href="#i-chevron-right"/></svg></div>
  </div>
  <div class="group-foot">OGG files are not supported yet. Tap a row to see the file names.</div>
  <div style="margin-top:22px"><span class="btn block">Show Library</span></div>
</div>
<div class="home-ind"></div>
</body>
</html>
