<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>01 Empty library</title><link rel="stylesheet" href="mockup.css"><script src="mockup.js"></script></head>
<body>
<div class="screen">
  <div class="status"><span>9:41</span><span class="bat"></span></div>
  <div class="navrow"><span class="glass"><svg class="ico"><use href="#i-ellipsis"/></svg></span></div>
  <div class="large-title">Songs</div>
  <div class="empty">
    <svg class="ico glyph"><use href="#i-notes-empty"/></svg>
    <h2>No Music Yet</h2>
    <p>Import songs from Files. owntune keeps its own copy, so your music stays available offline.</p>
    <span class="btn"><svg class="ico"><use href="#i-plus"/></svg>Import Music</span>
    <div class="hint">MP3, M4A/AAC, FLAC and WAV</div>
  </div>
  <nav class="tabbar">
    <a class="on"><svg class="ico"><use href="#i-music-note-fill"/></svg>Songs</a>
    <a><svg class="ico"><use href="#i-stack"/></svg>Albums</a>
    <a><svg class="ico"><use href="#i-mic"/></svg>Artists</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body>
</html>
