<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>01 Empty library</title><link rel="stylesheet" href="mockup.css"><script src="mockup.js"></script></head>
<body>
<div class="screen">
  <div class="status"><span>9:41</span><span class="bat"></span></div>
  <div class="appbar"><h1>Songs</h1><div class="actions"><span class="glass"><svg class="ico"><use href="#i-ellipsis"/></svg></span><span class="glass tint"><svg class="ico"><use href="#i-plus"/></svg></span></div></div>
  <div class="empty">
    <div class="disc-art"></div>
    <h2>Your library is empty</h2>
    <p>Import music files from your phone. owntune copies them into its own library, so they stay available offline.</p>
    <span class="btn"><svg class="ico"><use href="#i-plus"/></svg>Import Music</span>
    <div class="hint">MP3 · M4A/AAC · FLAC · WAV</div>
  </div>
  <nav class="tabbar">
    <a class="on"><svg class="ico"><use href="#i-music-note-fill"/></svg>Songs</a>
    <a><svg class="ico"><use href="#i-stack"/></svg>Albums</a>
    <a><svg class="ico"><use href="#i-person"/></svg>Artists</a>
  </nav>
  <div class="home-ind"></div>
</div>
</body>
</html>
