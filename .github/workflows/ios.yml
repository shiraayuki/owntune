name: iOS

# Releases only: macOS runners often have long queue times.
# Version tag (git tag v0.1.0 && git push --tags) → .ipa + GitHub release with
# SideStore source (releases/latest/download/source.json).
# Manual (gh workflow run iOS) → .ipa as artifact only, no release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "macOS runner (arm64 runners are often at capacity)"
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-latest]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  ios:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: flutter pub get

      - name: Build iOS app (unsigned)
        run: |
          ARGS=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            ARGS=(--build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER")
          fi
          flutter build ios --release --no-codesign "${ARGS[@]}"

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr owntune.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: owntune-ipa
          path: owntune.ipa
          if-no-files-found: error

      - name: GitHub release with SideStore source
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dart run tool/sidestore_source.dart "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" owntune.ipa > source.json
          gh release create "$GITHUB_REF_NAME" owntune.ipa source.json \
            --title "owntune $GITHUB_REF_NAME" --generate-notes
