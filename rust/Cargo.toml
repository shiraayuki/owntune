[package]
name = "rust_lib_owntune"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
lofty = "=0.25.5"
blake3 = "=1.8.7"
ebur128 = "=0.1.11"
symphonia = { version = "=0.6.1", default-features = false, features = ["opt-simd", "aac", "alac", "flac", "mp3", "pcm", "isomp4", "wav"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
