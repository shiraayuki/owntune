name: Pages

# Publishes site/ (the download page) to https://shiraayuki.github.io/owntune
# whenever it changes on main, or by hand (gh workflow run Pages).
# Needs Pages switched on with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

# Upload and deploy are separate jobs, like GitHub's own starter workflow:
# in one job, deploy-pages at times could not see the artifact yet
# ("Fetching artifact metadata failed").
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Upload site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
